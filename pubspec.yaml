name: flutter_bdface_collect_plus
description: Baidu face offline collect plugin for Android, iOS and OpenHarmony (fork with OHOS & SDK 6.4.x).
version: 1.2.0
homepage: https://github.com/2000Heart/flutter_bdface_collect
repository: https://github.com/2000Heart/flutter_bdface_collect
issue_tracker: https://github.com/2000Heart/flutter_bdface_collect/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

topics:
  - face
  - baidu
  - collect
  - ohos
  - openharmony

flutter:
  plugin:
    platforms:
      android:
        package: com.heart.flutter_bdface_collect_plus
        pluginClass: FlutterBdfaceCollectPlugin
      ios:
        pluginClass: FlutterBdfaceCollectPlugin
      ohos:
        pluginClass: FlutterBdfaceCollectPlugin

group 'com.heart.flutter_bdface_collect_plus'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "${project(':flutter_bdface_collect_plus').projectDir}/repo"
        }
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.heart.flutter_bdface_collect_plus'
    compileSdk 34

    defaultConfig {
        minSdk 22
    }

    lint {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            consumerProguardFiles "proguard-rules.pro"
        }
    }
}

dependencies {
    api 'com.baidu.idl:faceplatform:6.4.6.1'
    api 'com.baidu.idl:faceplatform-ui:6.4.6'
}
